          },
          en: {
            title: "Next Generation",
            intro: "The next generation of Mental Smile OS can build on Generation 1 without collapsing the architecture.",
            sections: [
              ["Tools", ["Tool systems can be developed as registered cards, packages, and discovery relationships."]],
              ["AI", ["AI can support research, summaries, accessibility, and strategic analysis while staying inside clear zones and audit boundaries."]],
              ["Research and Accessibility", ["Research can grow inside the Library Web Zone. Accessibility can become a first-class district, asset family, and support layer."]],
              ["External Apps and Partners", ["Future apps and partners can connect as federation members instead of being merged into the core platform."]],
              ["Future Expansion", ["Do not copy the past. Extract, purify, reclassify, rebuild, and register."]]
            ]
          }
        }
      };

      const languageButtons = document.querySelectorAll("[data-lang-button]");
      const languageBlocks = document.querySelectorAll("[data-lang]");
      const translatedNav = document.querySelectorAll("[data-i18n-ar]");
      const params = new URLSearchParams(window.location.search);
      const chapterId = chapters[params.get("chapter")] ? params.get("chapter") : "01";
      let activeLanguage = "ar";

      function renderChapter() {
        const chapter = chapters[chapterId];
        const content = chapter[activeLanguage];
        document.title = `${content.title} | Mental Smile OS`;
        document.getElementById("chapterNumber").textContent = chapterId;
        document.getElementById("chapterCrumb").textContent = content.title;
        document.getElementById("chapterTitle").textContent = content.title;
        document.getElementById("chapterIntro").textContent = content.intro;
        document.getElementById("chapterContent").innerHTML = content.sections
          .map(([heading, paragraphs]) => `
            <section class="chapter-section">
              <h2>${heading}</h2>
              ${paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
            </section>
          `)
          .join("");
      }

      function setLanguage(language) {
        activeLanguage = language;
        const isArabic = language === "ar";
        document.documentElement.lang = language;
        document.documentElement.dir = isArabic ? "rtl" : "ltr";

        languageBlocks.forEach((block) => {
          block.hidden = block.dataset.lang !== language;
        });

        translatedNav.forEach((item) => {
          item.textContent = isArabic ? item.dataset.i18nAr : item.dataset.i18nEn;
        });

        languageButtons.forEach((button) => {
          const active = button.dataset.langButton === language;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", String(active));
        });

        renderChapter();
      }

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.langButton));
      });

      renderChapter();
    </script>
  </body>
</html>
