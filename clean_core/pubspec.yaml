name: flutterprojects
description: Mental Smile clean-core foundation
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/branding/navigation/back/
    - assets/branding/navigation/logout/
    - assets/branding/library/hodn_amen/
    - assets/branding/library/bedaya_amena/
    - assets/branding/library/backgrounds/desktop/
    - assets/branding/library/backgrounds/tablet/
    - assets/branding/library/backgrounds/mobile/
    - assets/branding/logo_primary_dark.png
    - assets/branding/menu/desktop/
    - assets/branding/menu/tablet/
    - assets/branding/menu/mobile/
    - assets/branding/web_registration/centers/
    - assets/branding/web_registration/clinicians/
    - assets/c6_library/brand/logo_wordmark.png
    - assets/c6_library/categories/cat_articles.png
    - assets/c6_library/categories/cat_exercises.png
    - assets/c6_library/categories/cat_audio.png
    - assets/c6_library/categories/cat_videos.png
    - assets/c6_library/categories/cat_tools.png
    - assets/c6_library/categories/cat_saved.png
    - assets/c7_branding/home/
    - assets/c7_branding/logo/
    - assets/images/avatar_clinician_male.png
    - assets/images/backgrounds/
    - assets/images/centers/
